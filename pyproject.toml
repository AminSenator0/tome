[project]
name = "tome"
version = "0.1.0"
description = "Universal Book Processing and Translation Harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pdf-inspector",
    "gliner",
    "torch",
    "rapidfuzz",
    "fastapi",
    "python-multipart",
    "uvicorn",
    "textual",
    "rich",
    "pysocks",
    "requests[socks]",
    "httpx[socks]",
    "pydantic",
    "openai",
    "shekar",
    "pymupdf",
    "pillow",
    "ebooklib>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "mypy",
    "pyinstaller",
    "ruff",
    "black",
    "pyrefly",
]

[project.scripts]
tome = "tome.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tome"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
ignore = ["EXE002", "BLE001", "DTZ005", "D100", "D101", "D102", "D103", "D104", "D107", "B008"]

[tool.black]
line-length = 120
target-version = ["py311"]
